name: Tests

on: [push]

env:
  AUTH_SECRET: secret
  TG_TOKEN: na_for_test

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: "3.9"
      - name: Install dependencies
        run: |
          python -m pip install uv
          UV_CACHE_DIR=.uv-cache uv venv
          UV_CACHE_DIR=.uv-cache uv sync --frozen --dev
      - name: Run checks
        run: ./test.sh
