[project]
name = "infoscape"
version = "0.1.0"
description = "Telegram-first news aggregator"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp",
    "beautifulsoup4",
    "fastapi",
    "jinja2",
    "PyJWT",
    "pytz",
    "PyYAML",
    "uvicorn",
]

[dependency-groups]
dev = [
    "flake8",
    "mypy",
    "pytest",
    "types-pytz",
    "types-PyYAML",
]

[tool.mypy]
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
no_warn_no_return = true

[tool.pytest.ini_options]
testpaths = ["app"]

[tool.uv]
package = false
